name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the python3 macOS ships, which is what the skills run under.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Script tests
        run: |
          for t in skills/*/scripts/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
      - name: Plugin manifests parse
        run: |
          for j in .claude-plugin/*.json; do
            python -m json.tool "$j" > /dev/null
          done
