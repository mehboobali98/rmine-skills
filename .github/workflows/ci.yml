name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the python3 macOS ships, which is what the skills run under.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Script tests
        run: |
          for t in skills/*/scripts/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
      - name: Format examples pass the format check
        run: python skills/estimate/scripts/check_format.py skills/estimate/references/format-examples.md
      - name: Plugin manifests parse
        run: |
          for j in .claude-plugin/*.json; do
            python -m json.tool "$j" > /dev/null
          done

  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: /demo script tests
        run: node --test skills/demo/scripts/*.test.mjs
